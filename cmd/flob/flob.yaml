stores:
  # # There is no default store but any ".use" for "mem/*" will be treated as "mem" store
  # # and the stores are created on demand when used.

  # # Example:
  # os/cwd:
  #   path: .flob
  # http/local:
  #   targets: [http://localhost:8080]
  #   # auth:
  #   #   "http://localhost:8080":
  #   #     kind: bearer
  #   #     value: "${env:LOCAL_BLOB_TOKEN}"
  # s3/main:
  #   # endpoint: https://s3.us-east-1.amazonaws.com  # omit to derive from region
  #   region: us-east-1
  #   bucket: my-blobs
  #   prefix: flob                 # optional key prefix within the bucket
  #   path_style: false            # true for MinIO and most S3-compatible servers
  #   # public_endpoint: https://cdn.example.com  # client-facing URL for presigned redirects
  #   # Credentials and region fall back to AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
  #   # AWS_SESSION_TOKEN / AWS_REGION when omitted, so secrets can stay out of the file.
  #   # access_key_id: ...
  #   # secret_access_key: ...

server:
  # use: mem
  # addr: 0.0.0.0:8080            # listen address; network is inferred (tcp), or set it
  #                               # explicitly, e.g. tcp4:0.0.0.0:8087 / unix:/run/flob.sock
  # redirect: false               # true: GET redirects to a presigned S3 URL (S3 store only)
  # read_only: false
  # allowed_stores: ["_"]
  # # Omit auth for public serving. See README.md for matching client config.
  # # Server kind selects OIDC verification; client kind selects Bearer sending.
  # auth:
  #   providers:
  #     github:
  #       kind: oidc
  #       issuer: https://token.actions.githubusercontent.com
  #       audience: blob.example.com
  #   permissions:
  #     publish: {stores: ["_"], actions: [read, add]}
  #   matches:
  #     release:
  #       for: github
  #       when:
  #         repository_id: "123456789"
  #         workflow_ref: acme/assets/.github/workflows/publish.yml@refs/heads/main
  #         ref: refs/heads/main
  #       grant: [publish]

client:
  # use: http/local

otel:
  # exporters:
  #   pretty: {}
  # providers:
  #   logger:
  #     exporters:
  #       - pretty

  exporters:
    pretty: {}
    otlp/local:
      endpoint: localhost:4317
      tls:
        insecure: true
      sending_queue:
        enabled: false

  providers:
    tracer:
      exporters:
        - otlp/local
    meter:
      exporters:
        - otlp/local
    logger:
      exporters:
        - pretty
        - otlp/local
